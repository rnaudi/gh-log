[package]
name = "gh-log"
version = "0.1.25"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.6"
regex = "1.12.3"
anyhow = "1.0.102"
directories = "6.0"
toml = "1.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
proptest = "1.10"
insta = "1.47.0"
tempfile = "3.27"
